<title>Le déphasage à l’oscilloscope · Tom Bleyer</title>
<style>
:root { --bg: #05070d; --fg: #e6f6ff; --dim: #8aa3b5; --acc: #5ee1ff; --err: #ff8a8a; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(1200px 700px at 20% 30%, #0f3a4a 0%, transparent 60%), var(--bg); }
main { width: 100%; max-width: 420px; text-align: center; }
.logo { width: 76px; height: 76px; border-radius: 20px; margin: 0 auto 18px; display: block; box-shadow: 0 0 40px rgba(94,225,255,.25); }
.eyebrow { letter-spacing: .22em; font-size: 12px; font-weight: 600; color: var(--acc); text-transform: uppercase; }
h1 { font-size: clamp(28px, 7vw, 38px); line-height: 1.08; margin: 8px 0 6px; font-weight: 800; letter-spacing: -.02em; }
.sub { color: var(--dim); margin: 0 0 26px; }
form { display: grid; gap: 12px; text-align: left; }
label.feld { font-size: 14px; color: var(--dim); }
input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 14px 16px; border-radius: 14px; color: var(--fg);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); outline: none; letter-spacing: .04em; }
input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(94,225,255,.2); }
.merken { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--dim); }
.merken input { width: 20px; height: 20px; accent-color: var(--acc); }
button { font: inherit; font-weight: 700; font-size: 18px; padding: 14px; border-radius: 14px; border: 0; cursor: pointer;
  color: #031018; background: linear-gradient(135deg, #5ee1ff, #7aa8ff); }
button:disabled { opacity: .6; cursor: progress; }
.msg { min-height: 1.4em; font-size: 15px; color: var(--err); text-align: center; }
.fuss { margin-top: 28px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <img class="logo" src="apple-touch-icon.png" alt="">
  <div class="eyebrow">1GIGF · ELETE</div>
  <h1>Le déphasage<br>à l’oscilloscope</h1>
  <p class="sub">Présentation de Tom Bleyer</p>

    <label class="merken"><input id="m" type="checkbox" checked> Rester connecté sur cet appareil</label>
    <button id="b" type="submit">Ouvrir la présentation</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="fuss">Le mot de passe est affiché en classe avec le code QR.</p>
</main>

(function () {
  var LS = 'dephasage.cle';
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function zuB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function lesen(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function schreiben(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  var msg = document.getElementById('msg'), btn = document.getElementById('b');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'Ce navigateur ne peut pas ouvrir la présentation (HTTPS requis).'; btn.disabled = true; return; }

  function entschluesseln(rohKey) {
    return crypto.subtle.importKey('raw', rohKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(TRESOR.iv) }, k, b64(TRESOR.ct)); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function anzeigen(html) { document.open(); document.write(html); document.close(); }
  function ableiten(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(TRESOR.salt), iterations: TRESOR.iter }, k, 256); });
  }

  var gemerkt = lesen(LS);
  if (gemerkt) {
    // gemerkter Schlüssel gilt nur für diese Veröffentlichung (gleiches Salt), sonst neu anmelden
    try { var g = JSON.parse(gemerkt); if (g.salt === TRESOR.salt) { entschluesseln(b64(g.k)).then(anzeigen, function () { schreiben(LS, null); }); }
          else schreiben(LS, null); } catch (e) { schreiben(LS, null); }
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw.trim()) return;
    var merken = document.getElementById('m').checked;
    btn.disabled = true; msg.style.color = 'var(--dim)'; msg.textContent = 'Ouverture …';
    ableiten(pw).then(function (bits) {
      return entschluesseln(bits).then(function (html) {
        schreiben(LS, merken ? JSON.stringify({ salt: TRESOR.salt, k: zuB64(bits) }) : null);
        anzeigen(html);
      });
    }).catch(function () {
      btn.disabled = false; msg.style.color = ''; msg.textContent = 'Mot de passe incorrect. Réessaie.';
      var f = document.getElementById('pw'); f.select && f.select();
    });
  });
})();
